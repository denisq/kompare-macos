[package]
name = "kompare-web"
version = "0.2.0"
edition = "2021"
description = "Kompare-style visual diff viewer: Rust core, native WebView UI (Tauri)"
license = "GPL-2.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
rfd = "0.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
