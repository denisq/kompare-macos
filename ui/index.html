<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kompare</title>
<style>
:root {
  --bg: #ffffff; --fg: #1d1d1f; --fg-dim: #5c5c61; --dim: #6e6e73; --faint: #f5f5f7; --border: #d9d9de;
  --toolbar: #f6f6f8; --sidebar: #f7f7f9; --sel: #d6e6fb; --accent: #2f6fd0;
  --rep: #edbebe; --ins: #bebeed; --del: #beedbe;            /* Kompare: changed red, added blue, removed green */
  --rep-mark: #d99a9a; --ins-mark: #9a9ad9; --del-mark: #9ad99a;
  --rep-sel: #e4a9a9; --ins-sel: #a9a9e4; --del-sel: #a9e4a9;
  --hunk: #ececef; --hover: rgba(47,111,208,.13); --hover-blk: rgba(0,0,0,.055);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1c1e; --fg: #e6e6ea; --fg-dim: #a9a9b0; --dim: #98989f; --faint: #262628; --border: #3a3a3e;
    --toolbar: #2a2a2d; --sidebar: #232326; --sel: #27405f; --accent: #6ea8f7;
    --rep: #633f3f; --ins: #3f3f63; --del: #3f633f;
    --rep-mark: #8d5555; --ins-mark: #55558d; --del-mark: #558d55;
    --rep-sel: #7a4a4a; --ins-sel: #4a4a7a; --del-sel: #4a7a4a;
    --hunk: #2f2f33; --hover: rgba(110,168,247,.18); --hover-blk: rgba(255,255,255,.07);
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overscroll-behavior: none; }
body {
  background: var(--bg); color: var(--fg);
  font: 13px/1.4 -apple-system, "SF Pro Text", system-ui, sans-serif;
  -webkit-user-select: none; user-select: none; overflow: hidden;
}
button {
  font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; padding: 4px 10px; cursor: default;
}
button:focus { outline: none; }
button:hover:not(:disabled) { background: var(--faint); }
button:active:not(:disabled) { background: var(--border); }
button:disabled { opacity: .4; }
button.on { background: var(--sel); border-color: transparent; color: var(--accent); }

/* ---------- toolbar (title bar is merged into it; 84px keeps clear of the traffic lights) ---------- */
#toolbar {
  height: 52px; display: flex; align-items: center; gap: 6px; padding: 0 12px 0 84px;
  background: var(--toolbar); border-bottom: 1px solid var(--border);
}
#toolbar button { background: transparent; border-color: transparent; padding: 4px 9px; }
#toolbar button:hover:not(:disabled) { background: rgba(127,127,127,.15); }
#toolbar button.on { background: var(--sel); color: var(--accent); }
#toolbar .sep { width: 1px; height: 22px; background: var(--border); margin: 0 4px; }
#toolbar .counter { font: 12px ui-monospace, Menlo, monospace; color: var(--dim); min-width: 150px; text-align: center; }
#toolbar .spacer { flex: 1; }
#toolbar .title { color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40%; }

/* ---------- layout ---------- */
#app { display: flex; flex-direction: column; height: 100%; }
#body { display: flex; flex: 1; min-height: 0; }
#sidebar {
  width: 290px; flex: none; background: var(--sidebar); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}
body.nosidebar #sidebar { display: none; }
#sidebar h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--dim); padding: 10px 12px 4px; }
#sidebar .list { overflow: auto; }
#files.list { max-height: 40%; border-bottom: 1px solid var(--border); }
#changes.list { flex: 1; }
.row { display: grid; padding: 5px 12px; cursor: default; font-size: 12.5px; }
.row:hover { background: var(--faint); }
.row.sel { background: var(--sel); }
#changes .row { grid-template-columns: 44px 44px 1fr; }
#changes .row .n { color: var(--dim); font-variant-numeric: tabular-nums; }
#files .row { grid-template-columns: 1fr; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

#main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#heads { display: grid; grid-template-columns: 1fr 34px 1fr; background: var(--faint); border-bottom: 1px solid var(--border); }
#heads div { padding: 4px 10px; font-size: 12px; color: var(--fg-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#view { flex: 1; display: grid; grid-template-columns: 1fr 34px 1fr; min-height: 0; position: relative; }
.pane { position: relative; overflow: hidden; background: var(--bg); }
#left { overflow: auto; }
#spacer { width: 1px; }
.content { position: absolute; top: 0; left: 0; min-width: 100%; will-change: transform; }
body.nowrap .text { white-space: pre; }
#connect { background: var(--bg); overflow: visible; }
#connect svg { width: 100%; height: 100%; display: block; overflow: visible; }

/* ---------- diff blocks ---------- */
.hunk {
  font: 11px/18px ui-monospace, Menlo, monospace; color: var(--dim); background: var(--hunk);
  padding: 2px 10px 2px 62px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
  white-space: nowrap; overflow: hidden;
}
.block { position: relative; }
.block.rep { background: var(--rep); } .block.ins { background: var(--ins); } .block.del { background: var(--del); }
.block.rep.sel { background: var(--rep-sel); } .block.ins.sel { background: var(--ins-sel); } .block.del.sel { background: var(--del-sel); }
/* Kompare: darker line on the top and bottom edge of the selected difference */
.block.sel { box-shadow: inset 0 1px 0 rgba(0,0,0,.28), inset 0 -1px 0 rgba(0,0,0,.28); }
@media (prefers-color-scheme: dark) { .block.sel { box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -1px 0 rgba(255,255,255,.35); } }
.block.hovblk::after { content: ''; position: absolute; inset: 0; background: var(--hover-blk); pointer-events: none; }
.blank { height: 3px; }                       /* Kompare's BLANK_LINE_HEIGHT: the empty side of an insert/delete */
.line { display: flex; min-height: 20px; position: relative; }
.line.hov { background: var(--hover); }
.ln {
  flex: none; width: 52px; padding-right: 8px; text-align: right;
  font: 10.5px/20px ui-monospace, Menlo, monospace; color: var(--dim);
  border-right: 1px solid var(--border); background: rgba(127,127,127,.08);
}
.block.rep .ln, .block.ins .ln, .block.del .ln { background: transparent; border-right-color: transparent; }
.text {
  flex: 1; padding: 0 8px; font: 12.5px/20px ui-monospace, "SF Mono", Menlo, monospace;
  white-space: pre-wrap; overflow-wrap: anywhere; -webkit-user-select: text; user-select: text;
}
.block.eq .text { color: var(--fg-dim); }    /* Kompare: unchanged text grey, changed text black */
.rep mark { background: var(--rep-mark); } .ins mark { background: var(--ins-mark); } .del mark { background: var(--del-mark); }
mark { color: inherit; border-radius: 2px; }
#svg path { transition: filter .08s; }
#svg path.hov { filter: brightness(.93); }
@media (prefers-color-scheme: dark) { #svg path.hov { filter: brightness(1.15); } }

/* ---------- text view ---------- */
#textview { height: 200px; border-top: 1px solid var(--border); overflow: auto; display: none; background: var(--faint); }
body.textview #textview { display: block; }
#textview pre { font: 12px/1.5 ui-monospace, Menlo, monospace; padding: 10px 14px; -webkit-user-select: text; user-select: text; }

/* ---------- start screen ---------- */
#start { display: none; flex: 1; align-items: flex-start; justify-content: center; padding-top: 11vh; overflow: auto; }
body.empty #start { display: flex; }
body.empty #toolbar, body.empty #body { display: none; }
.card { width: 520px; max-width: calc(100% - 40px); }
.card h1 { font-size: 30px; font-weight: 600; text-align: center; }
.card .sub { color: var(--dim); text-align: center; margin: 4px 0 24px; }
.big { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 14px 16px; font-size: 15px; font-weight: 600; margin-bottom: 8px; border-radius: 10px; }
.big kbd { font: 12px -apple-system, system-ui; color: var(--dim); font-weight: 400; }
.hint { color: var(--dim); text-align: center; font-size: 12px; margin: 6px 0 26px; }
.recent-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.recent-h b { font-size: 14px; }
.recent-h button { font-size: 11px; padding: 2px 8px; }
.ritem { display: flex; gap: 12px; align-items: center; padding: 8px 12px; border-radius: 8px; background: var(--faint); margin-bottom: 5px; cursor: default; }
.ritem:hover { background: var(--sel); }
.ritem .ico { font-size: 18px; width: 22px; text-align: center; }
.ritem .t { font-size: 14px; }
.ritem .d { font-size: 11px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ritem .meta { min-width: 0; }

/* ---------- context menu ---------- */
#ctx { position: fixed; display: none; min-width: 200px; padding: 5px; background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; box-shadow: 0 8px 28px rgba(0,0,0,.22); z-index: 50; font-size: 13px; }
#ctx.show { display: block; }
#ctx div { padding: 4px 10px; border-radius: 5px; }
#ctx div:hover { background: var(--accent); color: #fff; }
#ctx div.dis { opacity: .4; pointer-events: none; }
#ctx hr { border: 0; border-top: 1px solid var(--border); margin: 4px 6px; }

/* ---------- dialogs ---------- */
#error { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.25); }
#error.show { display: flex; }
#error .box { background: var(--bg); padding: 18px 20px; border-radius: 12px; max-width: 460px; box-shadow: 0 12px 40px rgba(0,0,0,.3); }
#error .box p { margin-bottom: 14px; -webkit-user-select: text; user-select: text; }
#error .box .btns { text-align: right; }
.drop-hint { position: fixed; inset: 12px; border: 2px dashed var(--accent); border-radius: 14px; display: none; pointer-events: none; }
body.dragging .drop-hint { display: block; }
</style>
</head>
<body class="empty">
<div id="app">
  <div id="toolbar">
    <button id="b-home" title="Close and return to the start screen (⌘W)">Home</button>
    <button id="b-open" title="Open a diff file (⌘O)">Open…</button>
    <button id="b-compare" title="Compare two files (⇧⌘C)">Compare…</button>
    <div class="sep"></div>
    <button id="b-prev" title="Previous difference (⌘↑)">▲</button>
    <span class="counter" id="counter">0 differences</span>
    <button id="b-next" title="Next difference (⌘↓)">▼</button>
    <span id="filenav" style="display:none">
      <div class="sep" style="display:inline-block;vertical-align:middle"></div>
      <button id="b-prevfile" title="Previous file (⌘⇞)">« File</button>
      <span class="counter" id="filecounter" style="min-width:90px"></span>
      <button id="b-nextfile" title="Next file (⌘⇟)">File »</button>
    </span>
    <span class="spacer"></span>
    <span class="title" id="title"></span>
    <div class="sep"></div>
    <button id="b-sidebar" class="on" title="Show the navigation sidebar (⌘N)">Sidebar</button>
    <button id="b-wrap" class="on" title="Wrap long lines (⇧⌘W)">Wrap</button>
    <button id="b-text" title="Show the raw diff text">Text</button>
  </div>

  <div id="body">
    <div id="sidebar">
      <h3 id="files-h">Files</h3>
      <div id="files" class="list"></div>
      <h3 id="changes-h">Changes</h3>
      <div id="changes" class="list"></div>
    </div>
    <div id="main">
      <div id="heads"><div id="head-l"></div><div></div><div id="head-r"></div></div>
      <div id="view">
        <div id="left" class="pane"><div id="spacer"></div><div class="content" id="leftc"></div></div>
        <div id="connect"><svg id="svg"></svg></div>
        <div id="right" class="pane"><div class="content" id="rightc"></div></div>
      </div>
      <div id="textview"><pre id="raw"></pre></div>
    </div>
  </div>

  <div id="start">
    <div class="card">
      <h1>Kompare</h1>
      <div class="sub">View the differences between two files, or open a diff</div>
      <button class="big" id="s-open">Open Diff… <kbd>⌘O</kbd></button>
      <button class="big" id="s-compare">Compare Two Files… <kbd>⇧⌘C</kbd></button>
      <div class="hint">or drop a .diff / .patch file (or two files to compare) onto this window</div>
      <div id="recent-wrap" style="display:none">
        <div class="recent-h"><b>Recent</b><button id="s-clear">Clear</button></div>
        <div id="recent"></div>
      </div>
    </div>
  </div>
</div>
<div class="drop-hint"></div>
<div id="ctx"></div>
<div id="error"><div class="box"><p id="error-msg"></p><div class="btns"><button id="error-ok">OK</button></div></div></div>

<script src="mock.js"></script>
<script>
(() => {
const T = window.__TAURI__ || null;
const invoke = T ? T.core.invoke : null;
const $ = (id) => document.getElementById(id);
const TAB = 4;
const LINE_H = 20;           // CSS line height of a text row
const SCROLL_LINES = 3;      // Kompare's "scroll number of lines" default

// ------------------------------------------------------------ state
const S = { files: [], cur: 0, sel: null, raw: '', title: '', kind: 'diff', source: '', destination: '' };
const prefs = JSON.parse(localStorage.getItem('kompare-prefs') || '{}');
if (prefs.sidebar === false) document.body.classList.add('nosidebar');
if (prefs.wrap === false) document.body.classList.add('nowrap');
let recents = JSON.parse(localStorage.getItem('kompare-recents') || '[]');
const savePrefs = () => localStorage.setItem('kompare-prefs', JSON.stringify({
  sidebar: !document.body.classList.contains('nosidebar'), wrap: !document.body.classList.contains('nowrap') }));

// ------------------------------------------------------------ helpers
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const expand = (s) => s.includes('\t') ? s.replace(/\t/g, ' '.repeat(TAB)) : s;
function lineHtml(text, marks) {
  // marks are (start,end) ranges in Unicode code points, matching Rust's char indices
  text = expand(text);
  if (!marks || !marks.length) return esc(text);
  const cps = Array.from(text);
  let out = '', pos = 0;
  for (const [a, b] of marks) {
    out += esc(cps.slice(pos, a).join('')) + '<mark>' + esc(cps.slice(a, b).join('')) + '</mark>';
    pos = b;
  }
  return out + esc(cps.slice(pos).join(''));
}
const kindCls = { Change: 'rep', Insert: 'ins', Delete: 'del', Unchanged: 'eq' };
function descr(d) {
  const p = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
  if (d.kind === 'Change') return `Changed ${p(d.src.length, 'line')}`;
  if (d.kind === 'Insert') return `Inserted ${p(d.dst.length, 'line')}`;
  if (d.kind === 'Delete') return `Deleted ${p(d.src.length, 'line')}`;
  return '';
}
const file = () => S.files[S.cur];
const changeCount = () => (file() ? file().change_idx.length : 0);
function showError(msg) { $('error-msg').textContent = msg; $('error').classList.add('show'); }
$('error-ok').onclick = () => $('error').classList.remove('show');

// ------------------------------------------------------------ rendering
function renderPanes() {
  const f = file();
  $('head-l').textContent = f.source; $('head-l').title = f.source;
  $('head-r').textContent = f.destination; $('head-r').title = f.destination;
  const L = [], R = [];
  let changeNo = 0;
  f.segments.forEach((seg, i) => {
    if (seg.HunkHeader !== undefined) {
      const h = `<div class="hunk" data-seg="${i}">${esc(seg.HunkHeader)}</div>`;
      L.push(h); R.push(h);
      return;
    }
    const d = seg.Diff;
    const cls = kindCls[d.kind];
    const k = d.kind === 'Unchanged' ? -1 : changeNo++;
    const side = (lines, marks, first) => {
      let html = `<div class="block ${cls}" data-seg="${i}" data-k="${k}">`;
      if (!lines.length) html += '<div class="blank"></div>';
      lines.forEach((t, j) => {
        html += `<div class="line" data-l="${j}"><span class="ln">${first + j}</span><span class="text">${lineHtml(t, marks[j]) || ' '}</span></div>`;
      });
      return html + '</div>';
    };
    L.push(side(d.src, d.src_marks, d.src_line));
    R.push(side(d.dst, d.dst_marks, d.dst_line));
  });
  $('leftc').innerHTML = L.join('');
  $('rightc').innerHTML = R.join('');
  measure();
}

function renderSidebar() {
  const multi = S.files.length > 1;
  $('files-h').style.display = multi ? '' : 'none';
  $('files').style.display = multi ? '' : 'none';
  $('files-h').textContent = `Files (${S.files.length})`;
  $('files').innerHTML = S.files.map((f, i) =>
    `<div class="row ${i === S.cur ? 'sel' : ''}" data-i="${i}">${esc(f.source === f.destination ? f.destination : f.source + ' → ' + f.destination)}</div>`).join('');
  for (const r of $('files').children) r.onclick = () => selectFile(+r.dataset.i);
  const f = file();
  $('changes-h').textContent = `Changes (${changeCount()})`;
  $('changes').innerHTML = f.change_idx.map((si, k) => {
    const d = f.segments[si].Diff;
    return `<div class="row ${S.sel === k ? 'sel' : ''}" data-k="${k}"><span class="n">${d.src_line}</span><span class="n">${d.dst_line}</span><span>${descr(d)}</span></div>`;
  }).join('');
  for (const r of $('changes').children) r.onclick = () => select(+r.dataset.k, true);
  $('filenav').style.display = multi ? '' : 'none';
  $('filecounter').textContent = `${S.cur + 1} / ${S.files.length} files`;
  $('b-prevfile').disabled = S.cur === 0;
  $('b-nextfile').disabled = S.cur + 1 >= S.files.length;
}

function updateSelection() {
  const n = changeCount();
  document.querySelectorAll('.block.sel').forEach(e => e.classList.remove('sel'));
  document.querySelectorAll('#changes .row.sel').forEach(e => e.classList.remove('sel'));
  if (S.sel !== null) {
    document.querySelectorAll(`.block[data-k="${S.sel}"]`).forEach(e => e.classList.add('sel'));
    const r = $('changes').children[S.sel];
    if (r) { r.classList.add('sel'); r.scrollIntoView({ block: 'nearest' }); }
  }
  $('counter').textContent = S.sel === null ? `${n} difference${n === 1 ? '' : 's'}` : `${S.sel + 1} / ${n} difference${n === 1 ? '' : 's'}`;
  $('b-prev').disabled = !(S.sel > 0 || S.cur > 0);
  $('b-next').disabled = !((S.sel !== null && S.sel + 1 < n) || (S.sel === null && n > 0) || S.cur + 1 < S.files.length);
  layout();
}

// ------------------------------------------------------------ Kompare's scrolling model
// One shared virtual scroll coordinate. Every segment owns a slot of max(leftHeight, rightHeight);
// each pane maps the coordinate proportionally inside the slot, so corresponding differences
// stay aligned at every scroll position (not only the selected one).
let segs = [], total = 0;
function measure() {
  const L = $('leftc').children, R = $('rightc').children;
  segs = []; let id = 0;
  for (let i = 0; i < L.length; i++) {
    const lh = L[i].offsetHeight, rh = (R[i] || L[i]).offsetHeight;
    const mh = Math.max(lh, rh);
    segs.push({ lt: L[i].offsetTop, lh, rt: (R[i] || L[i]).offsetTop, rh, id, mh });
    id += mh;
  }
  total = id;
  const sp = $('spacer');
  sp.style.height = total + 'px';
  sp.style.width = document.body.classList.contains('nowrap')
    ? Math.max($('leftc').scrollWidth, $('rightc').scrollWidth) + 'px' : '1px';
  layout();
}
function posFor(s) {
  if (!segs.length) return [0, 0];
  let lo = 0, hi = segs.length - 1;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (segs[mid].id <= s) lo = mid; else hi = mid - 1; }
  const g = segs[lo];
  const r = g.mh ? Math.min(1, Math.max(0, (s - g.id) / g.mh)) : 0;
  return [g.lt + r * g.lh, g.rt + r * g.rh];
}
function layout() {
  const sc = $('left'), s = sc.scrollTop, x = sc.scrollLeft;
  const [ls, rs] = posFor(s);
  $('leftc').style.transform = `translate(0px, ${s - ls}px)`;
  $('rightc').style.transform = `translate(${-x}px, ${-rs}px)`;
  drawBands();
}
function drawBands() {
  const svg = $('svg');
  const w = svg.clientWidth, h = svg.clientHeight;
  const vt = $('view').getBoundingClientRect().top;
  const colors = { rep: 'var(--rep)', ins: 'var(--ins)', del: 'var(--del)' };
  const selColors = { rep: 'var(--rep-sel)', ins: 'var(--ins-sel)', del: 'var(--del-sel)' };
  let out = '';
  for (const lb of $('leftc').querySelectorAll('.block[data-k]')) {
    const k = +lb.dataset.k; if (k < 0) continue;
    const rb = $('rightc').querySelector(`.block[data-k="${k}"]`);
    if (!rb) continue;
    const a = lb.getBoundingClientRect(), b = rb.getBoundingClientRect();
    const lt = a.top - vt, lbm = a.bottom - vt, rt = b.top - vt, rbm = b.bottom - vt;
    if (Math.min(lt, rt) > h || Math.max(lbm, rbm) < 0) continue;
    const cls = [...lb.classList].find(c => colors[c]);
    const sel = k === S.sel;
    const c = w * 0.4;  // Kompare: control points at 40% of the handle width
    const d = `M-1,${lt} C${c},${lt} ${w - c},${rt} ${w + 1},${rt} L${w + 1},${rbm} C${w - c},${rbm} ${c},${lbm} -1,${lbm} Z`;
    const stroke = sel ? ` stroke="rgba(0,0,0,.28)" stroke-width="1"` : '';
    out += `<path d="${d}" fill="${sel ? selColors[cls] : colors[cls]}"${stroke} data-k="${k}" data-seg="${lb.dataset.seg}"/>`;
  }
  svg.innerHTML = out;
  for (const p of svg.querySelectorAll('path')) p.onclick = () => select(+p.dataset.k, false);
}
$('left').addEventListener('scroll', layout);
$('right').addEventListener('wheel', (e) => { $('left').scrollTop += e.deltaY; $('left').scrollLeft += e.deltaX; e.preventDefault(); }, { passive: false });
$('connect').addEventListener('wheel', (e) => { $('left').scrollTop += e.deltaY; e.preventDefault(); }, { passive: false });
new ResizeObserver(() => measure()).observe($('view'));
document.fonts && document.fonts.ready.then(() => measure());

// ------------------------------------------------------------ hover: line ↔ counterpart, block pair + band
let hovered = [];
function clearHover() { for (const el of hovered) el.classList.remove('hov', 'hovblk'); hovered = []; }
function hoverAt(target) {
  clearHover();
  const path = target.closest && target.closest('#svg path');
  const block = target.closest && target.closest('.block');
  const seg = path ? path.dataset.seg : block ? block.dataset.seg : null;
  if (seg === null || seg === undefined) return;
  const pair = document.querySelectorAll(`.block[data-seg="${seg}"]`);
  const isChange = pair[0] && !pair[0].classList.contains('eq');
  if (isChange) {
    for (const b of pair) { b.classList.add('hovblk'); hovered.push(b); }
    const p = $('svg').querySelector(`path[data-seg="${seg}"]`);
    if (p) { p.classList.add('hov'); hovered.push(p); }
  }
  const line = target.closest && target.closest('.line');
  if (line) {
    const j = line.dataset.l;
    for (const b of pair) {
      const l = b.querySelector(`.line[data-l="${j}"]`);
      if (l) { l.classList.add('hov'); hovered.push(l); }
    }
  }
}
$('view').addEventListener('mousemove', (e) => hoverAt(e.target));
$('view').addEventListener('mouseleave', clearHover);
$('view').addEventListener('click', (e) => {
  const b = e.target.closest('.block[data-k]');
  if (b && +b.dataset.k >= 0 && !window.getSelection().toString()) select(+b.dataset.k, false);
});

// ------------------------------------------------------------ navigation
function scrollToSeg(segIndex) {
  const g = segs[segIndex]; if (!g) return;
  const sc = $('left');
  sc.scrollTop = Math.max(0, g.id - sc.clientHeight / 3);
}
function select(k, scroll) {
  if (k < 0 || k >= changeCount()) return;
  S.sel = k;
  updateSelection();
  if (scroll) {
    const l = document.querySelector(`#leftc .block[data-k="${k}"]`);
    if (l) scrollToSeg(+l.dataset.seg);
  }
}
function selectFile(i) {
  if (i < 0 || i >= S.files.length) return;
  S.cur = i; S.sel = changeCount() > 0 ? 0 : null;
  renderPanes(); renderSidebar(); updateSelection();
  $('left').scrollTop = 0;
  if (S.sel !== null) select(0, true);
}
function next() {
  const n = changeCount();
  if (S.sel !== null && S.sel + 1 < n) select(S.sel + 1, true);
  else if (S.sel === null && n > 0) select(0, true);
  else if (S.cur + 1 < S.files.length) selectFile(S.cur + 1);
}
function prev() {
  if (S.sel > 0) select(S.sel - 1, true);
  else if (S.cur > 0) { selectFile(S.cur - 1); select(changeCount() - 1, true); }
}
function scrollLines(n) { $('left').scrollTop += n * LINE_H; }
function scrollPages(n) { $('left').scrollTop += n * ($('left').clientHeight - LINE_H); }

// ------------------------------------------------------------ loading
function load(data) {
  S.files = data.files; S.cur = 0; S.raw = data.raw; S.title = data.title; S.kind = data.kind;
  S.source = data.source; S.destination = data.destination;
  S.sel = changeCount() > 0 ? 0 : null;
  document.body.classList.remove('empty');
  $('raw').textContent = data.raw;
  $('title').textContent = data.kind === 'diff' ? data.source : `${data.source}  ↔  ${data.destination}`;
  $('title').title = $('title').textContent;
  renderPanes(); renderSidebar(); updateSelection();
  if (S.sel !== null) select(0, true);
  setTitle(`${data.title} — Kompare`);
  addRecent(data.kind === 'diff' ? { kind: 'diff', path: data.source } : { kind: 'compare', a: data.source, b: data.destination });
}
function home() {
  S.files = []; S.sel = null; document.body.classList.add('empty');
  setTitle('Kompare'); renderRecents();
}
async function setTitle(t) {
  document.title = t;
  if (T) { try { await T.window.getCurrentWindow().setTitle(t); } catch (e) {} }
}
async function openDiff(path) {
  if (!invoke) { load(window.MOCK); return; }
  try { load(await invoke('open_diff', { path })); } catch (e) { showError(String(e)); }
}
async function compareFiles(a, b) {
  if (!invoke) { load(window.MOCK); return; }
  try { load(await invoke('compare_files', { a, b, context: 3 })); } catch (e) { showError(String(e)); }
}
async function openPaths(paths) {
  if (!paths.length) return;
  if (paths.length === 1) openDiff(paths[0]); else compareFiles(paths[0], paths[1]);
}
async function askOpen() {
  if (!invoke) return openDiff('mock');
  const p = await invoke('pick_file', { title: 'Open Diff', patchFilter: true });
  if (p) openDiff(p);
}
async function askCompare() {
  if (!invoke) return compareFiles('a', 'b');
  const a = await invoke('pick_file', { title: 'Compare Files — select the source file', patchFilter: false });
  if (!a) return;
  const b = await invoke('pick_file', { title: 'Compare Files — select the destination file', patchFilter: false });
  if (b) compareFiles(a, b);
}

// ------------------------------------------------------------ recents
const base = (p) => p.split('/').pop();
const dir = (p) => { const d = p.split('/').slice(0, -1).join('/'); return d.replace(/^\/Users\/[^/]+/, '~'); };
function addRecent(r) {
  recents = recents.filter(x => JSON.stringify(x) !== JSON.stringify(r)); recents.unshift(r); recents = recents.slice(0, 12);
  localStorage.setItem('kompare-recents', JSON.stringify(recents));
}
function renderRecents() {
  $('recent-wrap').style.display = recents.length ? '' : 'none';
  $('recent').innerHTML = recents.map((r, i) => r.kind === 'diff'
    ? `<div class="ritem" data-i="${i}"><span class="ico">📄</span><span class="meta"><div class="t">${esc(base(r.path))}</div><div class="d">${esc(dir(r.path))}</div></span></div>`
    : `<div class="ritem" data-i="${i}"><span class="ico">⇄</span><span class="meta"><div class="t">${esc(base(r.a))}  ↔  ${esc(base(r.b))}</div><div class="d">${esc(dir(r.a))}</div></span></div>`).join('');
  for (const el of $('recent').children) el.onclick = () => { const r = recents[+el.dataset.i]; r.kind === 'diff' ? openDiff(r.path) : compareFiles(r.a, r.b); };
}
$('s-clear').onclick = () => { recents = []; localStorage.removeItem('kompare-recents'); renderRecents(); };

// ------------------------------------------------------------ wiring
$('b-home').onclick = home;
$('b-open').onclick = $('s-open').onclick = askOpen;
$('b-compare').onclick = $('s-compare').onclick = askCompare;
$('b-prev').onclick = prev; $('b-next').onclick = next;
$('b-prevfile').onclick = () => selectFile(S.cur - 1);
$('b-nextfile').onclick = () => selectFile(S.cur + 1);
const toggle = (btn, cls, invert) => { btn.onclick = () => {
  document.body.classList.toggle(cls);
  btn.classList.toggle('on', invert ? !document.body.classList.contains(cls) : document.body.classList.contains(cls));
  savePrefs(); requestAnimationFrame(measure);
}; };
toggle($('b-sidebar'), 'nosidebar', true); toggle($('b-wrap'), 'nowrap', true); toggle($('b-text'), 'textview', false);
$('b-sidebar').classList.toggle('on', !document.body.classList.contains('nosidebar'));
$('b-wrap').classList.toggle('on', !document.body.classList.contains('nowrap'));

// Window dragging: press anywhere that is not interactive and not selectable text.
const NO_DRAG = 'button, input, kbd, .text, .row, .ritem, .block, #ctx, #error, #textview, #raw, .list';
const DRAG_OK = '#toolbar, #start, #sidebar, .hunk, #connect, #heads';
document.addEventListener('mousedown', (e) => {
  if (!T || e.button !== 0 || e.detail > 1) return;
  if (e.target.closest(NO_DRAG) || !e.target.closest(DRAG_OK)) return;
  T.window.getCurrentWindow().startDragging();
});
document.addEventListener('dblclick', (e) => {
  if (!T || e.target.closest(NO_DRAG) || !e.target.closest('#toolbar')) return;
  T.window.getCurrentWindow().toggleMaximize();
});

// No WebView context menu ("Reload", …): show Kompare's own popup instead.
const ctx = $('ctx');
function hideCtx() { ctx.classList.remove('show'); }
document.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  if (document.body.classList.contains('empty')) return;
  const hasSel = window.getSelection().toString().length > 0;
  const n = changeCount();
  const items = [
    ['Copy', () => document.execCommand('copy'), !hasSel],
    null,
    ['Previous Difference', prev, !(S.sel > 0 || S.cur > 0)],
    ['Next Difference', next, !((S.sel !== null && S.sel + 1 < n) || S.cur + 1 < S.files.length)],
    null,
    ['Previous File', () => selectFile(S.cur - 1), S.cur === 0],
    ['Next File', () => selectFile(S.cur + 1), S.cur + 1 >= S.files.length],
    null,
    [document.body.classList.contains('nosidebar') ? 'Show Sidebar' : 'Hide Sidebar', () => $('b-sidebar').onclick(), false],
  ];
  ctx.innerHTML = '';
  for (const it of items) {
    if (!it) { ctx.appendChild(document.createElement('hr')); continue; }
    const d = document.createElement('div');
    d.textContent = it[0]; if (it[2]) d.className = 'dis';
    d.onclick = () => { hideCtx(); it[1](); };
    ctx.appendChild(d);
  }
  ctx.classList.add('show');
  const x = Math.min(e.clientX, window.innerWidth - ctx.offsetWidth - 8);
  const y = Math.min(e.clientY, window.innerHeight - ctx.offsetHeight - 8);
  ctx.style.left = x + 'px'; ctx.style.top = y + 'px';
});
document.addEventListener('mousedown', (e) => { if (!ctx.contains(e.target)) hideCtx(); });
window.addEventListener('blur', hideCtx);

// Keyboard: Kompare's scrolling keys (arrows, j/k, PgUp/PgDn) plus ⌘-navigation.
document.addEventListener('keydown', (e) => {
  if (e.metaKey && e.key === 'c') { document.execCommand('copy'); e.preventDefault(); return; }
  if (e.metaKey && e.key === 'a') { e.preventDefault(); return; }
  if (e.metaKey && e.key === 'ArrowDown') { next(); e.preventDefault(); return; }
  if (e.metaKey && e.key === 'ArrowUp') { prev(); e.preventDefault(); return; }
  if (e.key === 'Escape') { $('error').classList.remove('show'); hideCtx(); return; }
  if (document.body.classList.contains('empty') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'ArrowDown' || e.key === 'j') { scrollLines(SCROLL_LINES); e.preventDefault(); }
  if (e.key === 'ArrowUp' || e.key === 'k') { scrollLines(-SCROLL_LINES); e.preventDefault(); }
  if (e.key === 'PageDown' || e.key === ' ') { scrollPages(1); e.preventDefault(); }
  if (e.key === 'PageUp') { scrollPages(-1); e.preventDefault(); }
  if (e.key === 'n') next();
  if (e.key === 'p') prev();
});

if (T) {
  T.event.listen('menu', (ev) => {
    const id = ev.payload;
    ({ open: askOpen, compare: askCompare, home, prev, next,
       prev_file: () => selectFile(S.cur - 1), next_file: () => selectFile(S.cur + 1),
       sidebar: () => $('b-sidebar').onclick(), wrap: () => $('b-wrap').onclick() })[id]?.();
  });
  T.event.listen('files-opened', (ev) => openPaths(ev.payload));
  T.event.listen('tauri://drag-enter', () => document.body.classList.add('dragging'));
  T.event.listen('tauri://drag-leave', () => document.body.classList.remove('dragging'));
  T.event.listen('tauri://drag-drop', (ev) => { document.body.classList.remove('dragging'); openPaths(ev.payload.paths || []); });
  invoke('take_pending').then(openPaths);
}
renderRecents();
if (!T && location.hash === '#mock') load(window.MOCK);
})();
</script>
</body>
</html>
